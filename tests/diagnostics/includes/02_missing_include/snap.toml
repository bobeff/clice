[test.before]
diagnostics = [
    {
        at = "⟦Point⟧ corner;",
        severity = "information",
        message = 'No header providing "Point" is directly included',
        source = "clice",
        code = "missing-includes",
    },
]

[[test.fixes.code_actions]]
kind = "quickfix"
title = "insert '#include \"point.h\"'"

[test.fixes.code_actions.edits]
"main.cpp" = '''
 #include "shape.h"
+#include "point.h"

 Shape square;
'''

[test.after]
diagnostics = []
